[project]
name = "edgefactory"
version = "0.1.0"
description = "Sport-agnostic edge discovery, validation and decay monitoring"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4,<3",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "duckdb>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
