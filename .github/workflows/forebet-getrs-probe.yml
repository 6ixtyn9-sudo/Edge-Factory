name: Forebet Browser Run getrs probe
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Forebet in= date (YYYY-MM-DD)'
        required: true
        default: '2026-09-30'
      tp:
        description: 'Forebet market tp'
        required: true
        default: '1x2'
        type: choice
        options:
          - 1x2
          - uo
          - bts
          - ht
permissions:
  contents: read
jobs:
  probe:
    name: One Forebet getrs Browser Run production probe
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RELAY_URLS: ${{ secrets.EDGE_FACTORY_RELAY_URLS }}
      RELAY_TOKEN: ${{ secrets.EDGE_FACTORY_RELAY_TOKEN }}
      PROBE_DATE: ${{ inputs.date }}
      PROBE_TP: ${{ inputs.tp }}
    steps:
      - name: Send exactly one forebet_getrs Browser Run POST
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          EXPECTED_OPERATION = "forebet_getrs"
          EXPECTED_TRANSPORT = "cloudflare_browser_rendering"
          relay_urls = os.environ.get("RELAY_URLS", "")
          token = os.environ.get("RELAY_TOKEN", "")
          worker_url = relay_urls.split(",", 1)[0].strip()
          day = os.environ.get("PROBE_DATE", "")
          tp = os.environ.get("PROBE_TP", "")
          if not worker_url or not token:
              print(json.dumps({"classification": "workflow_secret_configuration_error"}))
              sys.exit(1)
          if tp not in {"1x2", "uo", "bts", "ht"}:
              print(json.dumps({"classification": "bad_market"}))
              sys.exit(1)
          query = urllib.parse.urlencode({
              "ln": "en",
              "tp": tp,
              "in": day,
              "ord": "0",
              "tz": "0",
              "tzs": "",
              "tze": "",
              "output": "1",
          })
          source_url = "https://www.forebet.com/scripts/getrs.php?" + query
          payload = json.dumps({
              "token": token,
              "operation": EXPECTED_OPERATION,
              "url": source_url,
          }).encode("utf-8")
          request = urllib.request.Request(
              worker_url,
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "EdgeFactory-ForebetGetrsProbe/1.0",
              },
          )
          status = None
          raw = b""
          try:
              with urllib.request.urlopen(request, timeout=75) as response:
                  status = response.status
                  raw = response.read(65537)
          except urllib.error.HTTPError as error:
              status = error.code
              raw = error.read(65537)
          except Exception as error:
              print(json.dumps({
                  "classification": "workflow_transport_error",
                  "error_type": type(error).__name__,
              }))
              sys.exit(1)
          if len(raw) > 65536:
              print(json.dumps({
                  "http_response_status": status,
                  "classification": "workflow_response_size_overflow",
              }))
              sys.exit(1)
          try:
              envelope = json.loads(raw.decode("utf-8", "replace"))
          except Exception:
              print(json.dumps({
                  "http_response_status": status,
                  "classification": "workflow_non_json_response",
              }))
              sys.exit(1)
          if not isinstance(envelope, dict):
              print(json.dumps({
                  "http_response_status": status,
                  "classification": "workflow_unexpected_json_response",
              }))
              sys.exit(1)
          operation = envelope.get("operation")
          transport = envelope.get("transport")
          worker_supports_browser_getrs = (
              operation == EXPECTED_OPERATION and transport == EXPECTED_TRANSPORT
          )
          relay_status = envelope.get("status")
          body_shape = envelope.get("body_shape")
          row_count = envelope.get("row_count")
          if isinstance(envelope.get("body"), str):
              try:
                  parsed = json.loads(envelope["body"])
                  body_shape = "forebet_getrs" if isinstance(parsed, list) and parsed and isinstance(parsed[0], list) else "unexpected"
                  row_count = len(parsed[0]) if body_shape == "forebet_getrs" else None
              except Exception:
                  body_shape = "non_json_body"
          ok = (
              status == 200
              and worker_supports_browser_getrs
              and relay_status == 200
              and body_shape == "forebet_getrs"
              and (row_count or 0) > 0
          )
          if ok:
              classification = "forebet_getrs_browser_rows"
          elif not worker_supports_browser_getrs and isinstance(envelope.get("body"), str):
              classification = "legacy_generic_relay_or_worker_not_deployed"
          elif not worker_supports_browser_getrs:
              classification = "unexpected_relay_contract_or_worker_not_deployed"
          elif envelope.get("error") == "browser_response_not_forebet_getrs_json":
              classification = "browser_run_returned_non_getrs_json"
          elif envelope.get("error"):
              classification = "browser_run_" + str(envelope.get("error"))
          else:
              classification = "forebet_getrs_probe_failed"
          receipt = {
              "classification": classification,
              "http_response_status": status,
              "source_url": source_url,
              "operation": operation,
              "transport": transport,
              "worker_supports_browser_getrs": worker_supports_browser_getrs,
              "relay_status": relay_status,
              "body_shape": body_shape,
              "row_count": row_count,
              "ok": ok,
          }
          if envelope.get("error"):
              receipt["relay_error"] = envelope.get("error")
          if envelope.get("content_type"):
              receipt["content_type"] = envelope.get("content_type")
          print(json.dumps(receipt, sort_keys=True))
          if not ok:
              sys.exit(1)
          PY

