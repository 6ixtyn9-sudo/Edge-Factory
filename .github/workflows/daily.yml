name: Daily Edge Factory Run

on:
  schedule:
    # Run every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install python-dotenv supabase

      - name: Run nightly pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
        run: |
          PYTHONPATH=src python scripts/daily.py

      - name: Upload daily report (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-picks-report
          path: localdata/picks_*.txt
          retention-days: 30
