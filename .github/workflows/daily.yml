name: Autonomous Edge Factory 3-Hour Service

on:
  schedule:
    # Wake up every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - official_morning
          - forecast_refresh
          - clv_only

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      TZ: 'Africa/Johannesburg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install supabase

      - name: Restore localdata State (Cache)
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: localdata-main-${{ github.run_id }}
          restore-keys: |
            localdata-main-

      - name: Restore committed registries (override stale cache)
        # The certified-edge and purity registries are committed to the repo
        # so they survive cache eviction. But actions/cache/restore unpacks
        # localdata/ AFTER checkout and can overwrite them with a stale 0-certified
        # copy from an earlier cold run. Re-check out the committed versions from
        # HEAD so the live certified registry always wins over stale cache.
        run: |
          set -e
          for f in localdata/edges_consensus.json localdata/purity_registry.json; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git checkout HEAD -- "$f"
              echo "restored committed: $f"
            else
              echo "not tracked, skipped: $f"
            fi
          done
          echo "certified edges present: $(python3 -c "import json;d=json.load(open('localdata/edges_consensus.json'));print(sum(1 for e in d.get('edges',[]) if e.get('status')=='certified'))" 2>/dev/null || echo n/a)"

      - name: Execute Autonomous Smart Schedule
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            echo ">>> Executing explicit manual mode: ${{ inputs.mode }}"
            if [ "${{ inputs.mode }}" = "official_morning" ]; then
              PYTHONPATH=src python3 scripts/daily.py --force-repick
            elif [ "${{ inputs.mode }}" = "forecast_refresh" ]; then
              PYTHONPATH=src python3 scripts/daily.py --forecast-refresh
            elif [ "${{ inputs.mode }}" = "clv_only" ]; then
              PYTHONPATH=src python3 scripts/daily.py --clv-only
            fi
          else
            # Execute exactly one autonomous iteration of the smart accumulating ledger
            PYTHONPATH=src python3 scripts/daily.py --auto-once
          fi

      - name: Persist localdata State (Cache)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: localdata
          key: localdata-main-${{ github.run_id }}

      - name: Upload Pick Ledgers & Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EdgeFactory-Reports
          path: |
            localdata/*.txt
            localdata/*.json
            localdata/*.md
          retention-days: 14
