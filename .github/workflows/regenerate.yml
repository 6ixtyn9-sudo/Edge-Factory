name: Regenerate Auto Tickets (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore localdata (cache)
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: localdata-v2-manual-${{ github.run_id }}
          restore-keys: |
            localdata-v2-
      - name: Restore committed data + prune
        run: |
          set -e
          for f in $(git ls-files localdata/); do git checkout HEAD -- "$f"; done
          git clean -fd localdata/ || true
      - name: Rebuild today's slip (force)
        run: PYTHONPATH=src python3 scripts/auto_tickets.py --today --force
      - name: Save localdata cache
        uses: actions/cache/save@v4
        with:
          path: localdata
          key: localdata-v2-manual-${{ github.run_id }}
      - name: Persist to git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A localdata/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: manual slip regeneration (run ${{ github.run_id }})"
          git pull --rebase --autostash || (git rebase --abort 2>/dev/null || true; exit 0)
          git push || (git pull --rebase --autostash && git push) || true
