name: Regenerate Auto Tickets (manual)
on:
  workflow_dispatch:
    inputs:
      prune_fixtures:
        description: "Comma-separated fixture substrings to REMOVE from open slips (e.g. Toluca). Empty = rebuild only."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore localdata (cache)
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: localdata-v2-manual-${{ github.run_id }}
          restore-keys: |
            localdata-v2-
      - name: Restore committed data + prune
        run: |
          set -e
          for f in $(git ls-files localdata/); do git checkout HEAD -- "$f"; done
          git clean -fd localdata/ || true
      - name: Clear today's frozen state (allow rebuild)
        run: |
          rm -f localdata/auto_tickets_$(date +%F).frozen
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("localdata/auto_tickets_state.json")
          if p.exists():
              st = json.loads(p.read_text())
              today = __import__("datetime").date.today().isoformat()
              st["open_slips"] = [s for s in st.get("open_slips", []) if s.get("date") != today]
              p.write_text(json.dumps(st, indent=2))
          PY
      - name: Prune unbettable accas (explicit, by fixture name)
        if: ${{ github.event.inputs.prune_fixtures != '' }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          targets = [t.strip().lower() for t in "${{ github.event.inputs.prune_fixtures }}".split(",") if t.strip()]
          p = Path("localdata/auto_tickets_state.json")
          st = json.loads(p.read_text())
          for slip in st.get("open_slips", []):
              before = len(slip["accas"])
              kept = []
              for a in slip["accas"]:
                  hit = any(any(t in l.get("match","").lower() for t in targets) for l in a.get("legs", []))
                  if not hit:
                      kept.append(a)
                  else:
                      print(f"  pruning acca from {slip['date']}: " +
                            " x ".join(l.get("match","?") for l in a.get("legs",[])))
              if kept != slip["accas"]:
                  slip["accas"] = kept
                  slip["staked_pct"] = round(sum(a.get("stake_pct",0) for a in kept), 4)
                  print(f"  {slip['date']}: {before} -> {len(kept)} accas, staked {slip['staked_pct']}%")
          p.write_text(json.dumps(st, indent=2))
          PY
      - name: Rebuild today's slip (force)
        run: PYTHONPATH=src python3 scripts/auto_tickets.py --today --force
      - name: Save localdata cache
        uses: actions/cache/save@v4
        with:
          path: localdata
          key: localdata-v2-manual-${{ github.run_id }}
      - name: Persist to git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A localdata/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: manual slip regeneration (run ${{ github.run_id }})"
          git pull --rebase --autostash || (git rebase --abort 2>/dev/null || true; exit 0)
          git push || (git pull --rebase --autostash && git push) || true
