name: Bounded source interrogation probe
on:
  workflow_dispatch:
    inputs:
      probe:
        required: true
        type: choice
        options:
          - pinnapi
          - betminer
          - boggio
          - sharpapi
          - oddspapi_markets
          - bzzoiro_odds
      date:
        description: 'Optional date; passed ONLY to date-capable probes (betminer, oddspapi_markets, bzzoiro_odds)'
        required: false
        type: string
      extra_args:
        description: 'Optional extra CLI args (e.g. --endpoint head-to-head --match-id 12345)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PINNAPI_KEY: ${{ inputs.probe == 'pinnapi' && secrets.PINNAPI_KEY || '' }}
      RAPIDAPI_KEY: ${{ (inputs.probe == 'betminer' || inputs.probe == 'boggio') && secrets.RAPIDAPI_KEY || '' }}
      SHARPAPI_KEY: ${{ inputs.probe == 'sharpapi' && secrets.SHARPAPI_KEY || '' }}
      ODDSPAPI_API_KEYS: ${{ inputs.probe == 'oddspapi_markets' && secrets.ODDSPAPI_API_KEYS || '' }}
      BZZOIRO_TOKEN: ${{ inputs.probe == 'bzzoiro_odds' && secrets.BZZOIRO_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install existing repo dependencies
        run: python3 -m pip install --quiet -r requirements.txt
      - name: Run existing bounded probe
        env:
          PROBE: ${{ inputs.probe }}
          DATE_IN: ${{ inputs.date }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          ARGS=""
          case "$PROBE" in
            betminer|oddspapi_markets|bzzoiro_odds)
              [ -n "$DATE_IN" ] && ARGS="--date $DATE_IN" ;;
          esac
          PYTHONPATH=src python3 "scripts/probe_${PROBE}.py" $ARGS $EXTRA
