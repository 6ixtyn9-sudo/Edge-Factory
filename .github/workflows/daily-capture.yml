name: daily-capture
on:
  schedule:
    - cron: "0 4 * * *"   # 06:00 Africa/Johannesburg (UTC+2)
  workflow_dispatch: {}    # allow manual runs
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run daily capture
        env:
          BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
        run: PYTHONPATH=src python3 scripts/capture_daily.py
